name: Release

# Publishes to PyPI on a release tag (`v0.1.0` or `0.1.0`) via trusted
# publishing (OIDC): no API token is stored in the repository. One-time setup on pypi.org: add a
# pending publisher for project `ledgerchain`, owner `mpointer`, repository
# `ledgerchain`, workflow `release.yml`, environment `pypi`.

on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - name: Run the suite once more against the tagged commit
        run: |
          python -m pip install -e ".[dev]"
          ruff check . && mypy && pytest
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
